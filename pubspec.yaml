name: edu_connect
description: "A campus connectivity app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  very_good_analysis: ^10.3.0

  # * Network *
  dio: ^5.4.1 
  retrofit: ^4.1.0 
  http_parser: ^4.0.2 
  pretty_dio_logger: ^1.3.1 
  connectivity_plus: ^7.3.1 
  dio_smart_retry: ^7.0.1

  # * State Management *
  riverpod_annotation: ^4.0.7
  hooks_riverpod: ^3.4.3
  flutter_hooks: ^0.21.3+1

  # * Route Management *
  go_router: ^17.5.0

  # * Functional Programming *
  fpdart: ^1.1.0

  # * Firebase *
  firebase_core: ^4.15.0
  firebase_crashlytics: ^5.4.0
  firebase_analytics: ^12.6.0 
  firebase_performance: ^0.11.6
  firebase_messaging: ^16.7.0

  # * Local Storage *
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.5

  # * Toast, Alerts, Notifications *
  bot_toast: ^4.1.3

  # * Code-gen *
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # * Launchers *
  url_launcher: ^6.3.1 
  url_strategy: ^0.3.0 

  # * Loading *
  loading_animation_widget: ^1.2.1
  flutter_easyloading: ^4.0.2
  shimmer: ^3.0.0
  flutter_spinkit: ^5.2.0

  # * Location *
  geocoding: ^5.0.0
  timezone: ^0.11.1

  # * Utils *
  intl: ^0.20.2
  uuid: ^4.3.3
  device_preview: ^3.0.0-prerelease3

  # * Device & Package *
  package_info_plus: ^10.2.1
  path: ^1.8.3
  path_provider: ^2.1.2


  # * Animations *
  animations: ^2.0.11
  flutter_animate: ^4.5.0
  lottie: ^3.3.1

  # * Extra Widgets *
  table_calendar: ^3.1.2 
  pinput: ^6.0.2 
  share_plus: ^13.3.0 
  animated_text_kit: ^4.2.2 
  flutter_rating_stars: ^1.0.3+4
  carousel_slider: ^5.1.2
  cached_network_image: ^3.3.1
  country_picker: ^2.0.25
  liquid_pull_to_refresh: ^3.0.1
  dotted_border: ^3.1.0
  flutter_svg: ^2.0.17

  image_picker: ^1.1.2
  file_picker: ^13.1.0
  photo_view: ^0.15.0
  flutter_remix: ^0.0.3
  flutter_image_compress: ^2.0.4
  flutter_typeahead: ^6.0.0
  syncfusion_flutter_pdfviewer: ^34.2.9

  # * TESTING *
  mocktail: ^1.0.3
  logger: ^2.2.0
  timeago: ^3.7.0
  fl_chart: ^1.2.0
  geolocator: ^14.1.0
  local_auth: ^3.0.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

  # --- Code generation ---
  build_runner: ^2.4.8
  go_router_builder: ^4.5.0
  riverpod_generator: ^4.0.9 
  freezed: ^4.0.0-dev.3
  json_serializable: ^6.7.1
  retrofit_generator: ^10.2.9
  flutter_gen_runner: ^5.9.0
  flutter_launcher_icons: ^0.14.4

flutter_gen:
  output: lib/gen/
  line_length: 120

  integrations:
    flutter_svg: true

  colors:
    inputs:
      - assets/color/colors.xml

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo-1.jpg"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/animations/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins/Poppins-Thin.ttf
        - asset: assets/fonts/Poppins/Poppins-ThinItalic.ttf
        - asset: assets/fonts/Poppins/Poppins-SemiBold.ttf
        - asset: assets/fonts/Poppins/Poppins-SemiBoldItalic.ttf
        - asset: assets/fonts/Poppins/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins/Poppins-Medium.ttf
        - asset: assets/fonts/Poppins/Poppins-MediumItalic.ttf
        - asset: assets/fonts/Poppins/Poppins-Light.ttf
        - asset: assets/fonts/Poppins/Poppins-LightItalic.ttf
        - asset: assets/fonts/Poppins/Poppins-ExtraLight.ttf
        - asset: assets/fonts/Poppins/Poppins-ExtraBold.ttf
        - asset: assets/fonts/Poppins/Poppins-ExtraLightItalic.ttf
        - asset: assets/fonts/Poppins/Poppins-Black.ttf
        - asset: assets/fonts/Poppins/Poppins-BoldItalic.ttf

    - family: Oleo_Script
      fonts:
        - asset: assets/fonts/Oleo_Script/OleoScript-Regular.ttf
        - asset: assets/fonts/Oleo_Script/OleoScript-Bold.ttf

    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald/Oswald-Light.ttf
        - asset: assets/fonts/Oswald/Oswald-Medium.ttf
        - asset: assets/fonts/Oswald/Oswald-SemiBold.ttf
        - asset: assets/fonts/Oswald/Oswald-Bold.ttf
